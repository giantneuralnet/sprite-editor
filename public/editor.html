function bottomStackPanelSize(width,height,headerHeight,dockHeight,gap,paddingX,paddingY){return Math.max(32,Math.floor(Math.min(width-paddingX,height-paddingY-headerHeight-dockHeight-4*gap-64)))}
function fitBottomStack(){
